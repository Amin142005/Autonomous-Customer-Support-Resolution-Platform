services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.12.4
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DEMO_MODE: "true"
      CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000","http://localhost:${FRONTEND_PORT:-3000}","http://127.0.0.1:${FRONTEND_PORT:-3000}"]'
      DATABASE_URL: sqlite+aiosqlite:////app/data/support.db
      CHECKPOINT_DB_PATH: /app/data/checkpoints.db
      REDIS_URL: redis://redis:6379/0
      USE_FAKE_REDIS: "false"
      VECTOR_STORE: qdrant
      QDRANT_URL: http://qdrant:6333
      SAMPLE_DATA_DIR: /app/sample_data
    ports:
      - "8000:8000"
    volumes:
      - backend-data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  redis-data:
  qdrant-data:
  backend-data:
